<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'>
  <title>{{ app_name }} :: {% block title %}{% endblock %}</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx-2.0.4.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <aside class="sidebar">
    <div class="brand"><a href="/">{{ app_name }}</a></div>
    <nav aria-label="Dashboard">
      <a href="/providers"{% block nav_providers %}{% endblock %}><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#server"></use></svg>Providers</a>
      <a href="/combos"{% block nav_combos %}{% endblock %}><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#layers"></use></svg>Combos</a>
      <a href="/api-keys"{% block nav_api_keys %}{% endblock %}><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#key"></use></svg>API keys</a>
      <a href="/test"{% block nav_test %}{% endblock %}><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#flask-conical"></use></svg>Test chat</a>
      <a href="/history"{% block nav_history %}{% endblock %}><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#clock"></use></svg>History</a>
      <a href="/configuration"{% block nav_configuration %}{% endblock %}><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#layers"></use></svg>Configuration</a>
      <a href="/logout"{% block nav_logout %}{% endblock %}><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#log-out"></use></svg>Log out</a>
    </nav>
  </aside>
  <div class="dashboard-content">
    <header class="topbar">
{% block topbar_heading %}{% endblock %}
      <button id="theme-toggle" type="button" class="btn theme-toggle" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#moon"></use></svg><span class="btn-label">Theme: Light</span></button>
    </header>
    <main id="content" tabindex="-1" class="{% block main_class %}{% endblock %}">
      <p id="action-error" class="test fail" role="alert" hidden></p>
{% block content %}{% endblock %}
    </main>
    <footer class="footer">{{ app_name }} &mdash; self-hosted LLM gateway with ordered fallback combos</footer>
  </div>
</body>
</html>
