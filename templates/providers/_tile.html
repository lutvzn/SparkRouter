<div class="provider-card" data-provider-tags="{{ t.tag_values() }}">
  <div class="provider-tile">
    <div class="provider-tile-heading">
      <div class="provider-title-row">
        <a class="provider-title-link" href="{{ t.href }}"><span class="provider-tile-title">{{ t.name }}</span></a>
        <form class="provider-favorite-form" method="post" action="{{ t.href }}/favorite">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          <input type="hidden" name="favorite" value="{% if t.is_favorite %}false{% else %}true{% endif %}">
          <button class="provider-favorite-button" type="submit" aria-pressed="{% if t.is_favorite %}true{% else %}false{% endif %}" aria-label="{% if t.is_favorite %}Unfavorite{% else %}Favorite{% endif %} {{ t.name }}" title="{% if t.is_favorite %}Unfavorite{% else %}Favorite{% endif %} {{ t.name }}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 2.78 5.63L21 9.54l-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.93 1.06-6.2L3 9.54l6.22-.91L12 3Z"/></svg></button>
        </form>
      </div>
    </div>
    <span class="provider-tile-meta">
      {% if t.is_custom %}<span class="badge">Custom</span>{% endif %}
      {% for tag in t.tag_labels() %}<span class="badge provider-capability-tag">{{ tag.label }}</span>{% endfor %}
    </span>
    {% if t.connection_count == 0 %}
    <span class="provider-tile-status"><span class="badge">not connected</span></span>
    {% else %}
    <span class="provider-tile-status">
      <span class="badge">{{ t.connection_count }} connection{{ t.connection_count|pluralize }}</span>
      <span class="badge{% if t.enabled_count == 0 %} off{% else %} ok{% endif %}">{{ t.enabled_count }} enabled</span>
    </span>
    {% endif %}
  </div>
</div>
