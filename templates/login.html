<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} :: Login</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login-page">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true"><svg class="icon" focusable="false"><use href="/static/icons.svg#zap"></use></svg></span>
      <div>
        <h1>{{ app_name }}</h1>
        <p class="hint">Your self-hosted LLM gateway.</p>
      </div>
    </div>
    <section class="card">
      <h2>Dashboard login</h2>
      {% if !error.is_empty() %}<p class="test fail" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <label for="password">Admin password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" maxlength="1024" required autofocus>
        <div class="form-actions"><button type="submit" class="btn primary">Log in</button></div>
      </form>
    </section>
    <p class="hint">Gateway API keys do not authorize dashboard access.</p>
  </main>
</body>
</html>
