<div class="grid3">
  <div>
    <label for="{{ group_control_id }}">Provider</label>
    <select id="{{ group_control_id }}" data-step-provider required>
      {% for group in provider_groups %}
      <option value="{{ group.id }}"{% if group.id == selected_group %} selected{% endif %}>{{ group.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="{{ connection_control_id }}">Connection</label>
    <select id="{{ connection_control_id }}" name="provider_id" data-step-connection required>
      {% for p in providers %}
      <option value="{{ p.id }}" data-provider="{{ p.group_id }}"{% if p.id == selected_connection %} selected{% endif %}>{{ p.connection_name }}{% if p.disabled %} (disabled){% endif %}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="{{ model_control_id }}">Model</label>
    <input id="{{ model_control_id }}" name="model" data-step-model type="text" required maxlength="256" value="{{ selected_model }}"{% if selected_model.is_empty() %} placeholder="e.g. gpt-4o-mini"{% endif %} autocomplete="off">
    {% for p in providers %}
    <datalist id="{{ model_list_prefix }}{{ p.id }}" data-models-for="{{ p.id }}">
      {% for model in p.models %}
      <option value="{{ model }}"></option>
      {% endfor %}
    </datalist>
    {% endfor %}
  </div>
</div>
<p class="hint">Suggestions only include matching-category models. If a custom model is unclassified, enter its ID manually to declare it in this combo's category.</p>
