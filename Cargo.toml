[package]
name = "sparkrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, self-hosted LLM gateway with ordered fallback combos"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
askama = "0.14"
async-stream = "0.3"
axum = { version = "0.8", features = ["form", "json", "http1", "tokio"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hmac = "0.13.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rust-embed = { version = "8", features = ["debug-embed"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
